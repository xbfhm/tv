name: Build Java APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 自动解压: 仓库根目录放 ad5.x-java.zip 即可, Actions 自动定位工程 ----
      - name: Extract project zip
        run: |
          set -e
          # 兼容 ad5.1 / ad5.2 及任意版本命名
          for z in ad5*-java.zip ad5*.zip; do
            if [ -f "$z" ]; then echo "解压: $z"; unzip -q -o "$z"; fi
          done
          # 定位 Gradle 工程根 (含 settings.gradle 的目录)
          PROJ=$(dirname "$(find . -maxdepth 2 -name settings.gradle | head -1)")
          if [ "$PROJ" = "." ]; then PROJ=""; fi
          echo "PROJECT_DIR=$(pwd)/$PROJ" >> $GITHUB_ENV
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: animetv-tv-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          overwrite: true

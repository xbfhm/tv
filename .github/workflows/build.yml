name: Build Java APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 自动解压: 仓库根目录放 ad*-java.zip 即可, 自动选版本号最新的构建 ----
      - name: Extract project zip
        run: |
          set -e
          # 清理之前解压的旧工程目录, 避免 find 定位到旧版本
          rm -rf ad*_java 2>/dev/null || true
          # 选版本号最大的源码包 (仓库残留旧版 zip 也不会构建错版本)
          LATEST=$(ls ad*-java.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then
            echo "!! 未在仓库根目录找到 ad*-java.zip, 请先上传源码包"
            exit 1
          fi
          echo "使用源码包: $LATEST"
          unzip -q -o "$LATEST"
          # 定位 Gradle 工程根 (含 settings.gradle 的目录)
          PROJ=$(dirname "$(find . -maxdepth 2 -name settings.gradle | head -1)")
          PROJ="${PROJ#./}"          # 去掉 './' 前缀 (upload-artifact 禁止相对路径)
          if [ -z "$PROJ" ]; then PROJ="."; fi
          echo "PROJECT_DIR=$(pwd)/$PROJ" >> $GITHUB_ENV
          echo "检测到工程目录: $PROJ"
          grep -E "versionName|versionCode|applicationId" "$PROJ/app/build.gradle" || true
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set +e
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace > build.log 2>&1
          RC=$?
          echo "gradle exit=$RC"
          grep -nE "error:|FAILURE:|What went wrong|Caused by:|> Task .*FAILED" build.log | head -60 || true
          tail -60 build.log
          exit $RC

      # ---- 构建失败时把错误日志推到 ci-log 分支, 便于排查 (公开仓库无需登录即可看) ----
      - name: Publish failure log to ci-log branch
        if: steps.build.outcome == 'failure'
        run: |
          set -e
          mkdir -p /tmp/cilog && cd /tmp/cilog
          cp "$GITHUB_WORKSPACE/build.log" build.log || true
          {
            echo "# Build failure $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "commit: ${{ github.sha }}"
            echo ""
            echo '```'
            grep -nE "error:|error;|FAILURE:|What went wrong|Caused by:|> Task .*FAILED|Execution failed" build.log | head -120 || true
            echo '```'
            echo ""
            echo "<details><summary>tail 300</summary>"
            echo ""
            echo '```'
            tail -300 build.log
            echo '```'
            echo ""
            echo "</details>"
          } > errors.md
          git init -q .
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add .
          git commit -qm "ci: build failure log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-log

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: animetv-tv-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          overwrite: true

      # ---- 同时发布到 latest Release（无需登录即可直接下载 APK）----
      - name: Publish to latest release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AnimeTV 最新构建
          body: 自动构建 · commit ${{ github.sha }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          overwrite_files: true
